[build]
  command = "npm ci --prefix functions && node --check functions/netlify/calendar-api.mjs"
  publish = "functions/public"
  functions = "functions/netlify"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "firebase-functions", "@google-cloud/firestore"]
